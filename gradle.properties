org.gradle.java.home=C:/Users/roni2/.gradle/jdks/azul_systems__inc_-21-amd64-windows.2

org.gradle.jvmargs=-Xmx4096M \
  -XX:+UseG1GC \
  -XX:+UseStringDeduplication \
  -Dkotlin.daemon.jvm.options="-Xmx2048M" \
  -XX:+HeapDumpOnOutOfMemoryError \
  --add-opens java.base/java.lang=ALL-UNNAMED \
  --add-opens java.base/java.util=ALL-UNNAMED \
  --add-opens java.base/java.io=ALL-UNNAMED

# Kotlin Compiler Optimizations
kotlin.incremental.useClasspathSnapshot=true

# Gradle Build Acceleration
org.gradle.caching=true
# org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.vfs.watch=true

# Android Gradle Plugin Optimizations
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=false
android.r8.version=8.6.17
android.disableResourceValidation=true

systemProp.https.protocols=TLSv1,TLSv1.1,TLSv1.2
